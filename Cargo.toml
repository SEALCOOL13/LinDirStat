[package]
name = "windirstat-linux"
version = "1.0.0"
description = "WinDirStat for Linux: parallel disk-usage scanner with treemap"
license = "GPL-2.0-or-later"
edition = "2021"

[dependencies]
egui = { version = "0.33.3", default-features = false }
bytemuck = "1.25.2"
crossbeam-deque = "0.8.8"
crossbeam-utils = "0.8.23"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui_extras = "0.33.3"
libc = "0.2.191"
mimalloc = "0.1.52"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
lz4_flex = { version = "0.14.2", default-features = false, features = ["frame", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 1
